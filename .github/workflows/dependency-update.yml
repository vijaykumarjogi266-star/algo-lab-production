name: Weekly Dependency Lock Audit

on:
  schedule:
    # 00:00 UTC every Monday
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  dependency-lock-audit:
    name: Verify Locked Dependencies vs Vulnerability Advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-pinned.txt

      - name: Verify Exact Version Match
        run: python3 scripts/verify_dependency_lock.py

      - name: Run Bandit Security Scan
        run: |
          pip install bandit
          bandit -r apps services quant src -ll -ii -x .venv,tests
