[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-lab"
version = "0.3.0"
description = "Algo Lab: Paper-Only Quantitative Investment Research and Forward-Simulation Platform for Indian Markets"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Algo Lab Core Team" }
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "duckdb>=1.0.0",
    "yfinance>=0.2.36",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "exchange-calendars>=4.5.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "websockets>=12.0",
    "tabulate>=0.9.0",
    "logzero>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.9",
]
brokers = [
    "kiteconnect>=5.0",
    "smartapi-python>=1.4",
    "pyotp>=2.9",
]

[project.scripts]
algolab-daemon = "live_market_daemon:main"
algolab-swing = "run_swing_live_forward_daemon:main"
algolab-preflight = "run_broker_preflight_agent:main"
algolab-multistrat = "run_multistrategy_paper_lab:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "quant*", "data*", "database*", "src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apps", "services", "src", "quant"]
omit = ["tests/*", ".venv/*", "apps/web/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
