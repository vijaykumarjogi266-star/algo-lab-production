# Algo Lab Canonical Hardened Docker Compose Configuration
# Workstream D: Deployment & Runtime Hardening
# Enforces non-root execution, resource limits, loopback-only bindings, no-new-privileges, and proxy isolation

services:
  postgres:
    image: postgres:16-alpine
    container_name: algolab-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algolab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algolab_secret}
      POSTGRES_DB: ${POSTGRES_DB:-algolab}
    ports:
      # Private loopback binding only
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algolab} -d ${POSTGRES_DB:-algolab}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - algolab-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: algolab-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-algolab}:${POSTGRES_PASSWORD:-algolab_secret}@postgres:5432/${POSTGRES_DB:-algolab}
      LIVE_TRADING_ENABLED: "false"
      REAL_BROKER_EXECUTION_ENABLED: "false"
    ports:
      # Private loopback binding only
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./apps:/app/apps:ro
      - ./services:/app/services:ro
      - ./quant:/app/quant:ro
      - ./data:/app/data
      - ./database:/app/database:ro
      - ./research:/app/research:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - algolab-network

  proxy:
    image: nginx:1.27-alpine
    container_name: algolab-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    networks:
      - algolab-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: algolab-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Private loopback binding only
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - algolab-network

volumes:
  postgres_data:
    name: algolab_postgres_data
  prometheus_data:
    name: algolab_prometheus_data

networks:
  algolab-network:
    name: algolab_network
    driver: bridge

